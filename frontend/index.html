<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Reviewer</title>
<link rel="icon" type="image/png" href="/assets/devpaul.png">
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script>
if (typeof marked !== 'undefined') {
  marked.setOptions({ breaks: true, gfm: true });
  // El contenido viene del LLM/transcripción: HTML crudo se muestra como texto y solo se permiten enlaces seguros.
  marked.use({ renderer: {
    html({ text }) { return escapeHtml(text); },
    link({ href, title, tokens }) {
      const inner = this.parser.parseInline(tokens);
      if (!/^(https?:|mailto:|#|\/)/i.test(href)) return inner;
      const t = title ? ` title="${escapeHtml(title)}"` : '';
      return `<a href="${escapeHtml(href)}"${t} target="_blank" rel="noopener noreferrer">${inner}</a>`;
    },
  } });
}
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  color-scheme: dark light;

  /* Legacy (no renombrar) */
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222636;
  --border: #2e3348;
  --text: #e6e8f0;
  --text2: #a3a9bd;
  --accent: #7b98ff;
  --accent2: #3350d0;
  --green: #4ade80;
  --yellow: #facc15;
  --red: #f87171;
  --radius: 8px;

  --text3: #8a90a6;
  --border-strong: #69718f;
  --surface3: #2b3046;
  --scrim: rgb(8 10 16 / .72);

  --accent-solid: #3d5be0;
  --accent-solid-hover: #3350d0;
  --accent-solid-active: #2a44b8;
  --on-accent: #ffffff;
  --accent-soft: rgb(123 152 255 / .14);
  --focus-ring: #9db4ff;

  --success-fg: #4ade80; --success-bg: rgb(74 222 128 / .12); --success-bd: rgb(74 222 128 / .45);
  --warn-fg: #facc15; --warn-bg: rgb(250 204 21 / .12); --warn-bd: rgb(250 204 21 / .45);
  --danger-fg: #f87171; --danger-bg: rgb(248 113 113 / .12); --danger-bd: rgb(248 113 113 / .5);
  --danger-solid: #c81e1e; --danger-solid-hover: #a91a1a;
  --info-fg: #7dd3fc; --info-bg: rgb(125 211 252 / .12); --info-bd: rgb(125 211 252 / .45);
  --rec: #ff4d4d;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 40px; --space-8: 48px;

  --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace;
  --fs-xs: .75rem; --fs-sm: .8125rem; --fs-md: .875rem; --fs-base: 1rem;
  --fs-lg: 1.125rem; --fs-xl: 1.375rem; --fs-2xl: 1.75rem;
  --lh-tight: 1.25; --lh-ui: 1.45; --lh-prose: 1.7;

  --radius-sm: 6px; --radius-lg: 12px; --radius-pill: 999px;

  --shadow-md: 0 4px 12px rgb(0 0 0 / .4);
  --shadow-lg: 0 16px 40px rgb(0 0 0 / .55);

  --z-sticky: 2; --z-sidebar: 30; --z-detail: 40; --z-scrim: 50; --z-modal: 60; --z-toast: 80;

  --ease: cubic-bezier(.2, .7, .2, 1);
  --t-fast: 120ms var(--ease); --t-base: 200ms var(--ease);

  --sidebar-w: 296px; --detail-w: min(720px, 55vw); --control-h: 40px;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --surface2: #eef0f6; --surface3: #e3e6f0; --border: #d5d9e6;
    --text: #1a1d27; --text2: #515872; --text3: #5f6682;
    --accent: #2f4bd0; --accent2: #2a44b8;
    --green: #15803d; --yellow: #92400e; --red: #b91c1c;
    --border-strong: #7a819b;
    --accent-solid: #2f4bd0; --accent-solid-hover: #2a44b8; --accent-solid-active: #233a9a;
    --accent-soft: rgb(47 75 208 / .10); --focus-ring: #2f4bd0; --scrim: rgb(20 24 40 / .45);
    --success-fg: #15803d; --success-bg: rgb(21 128 61 / .10); --success-bd: rgb(21 128 61 / .45);
    --warn-fg: #92400e; --warn-bg: rgb(180 83 9 / .10); --warn-bd: rgb(146 64 14 / .45);
    --danger-fg: #b91c1c; --danger-bg: rgb(185 28 28 / .08); --danger-bd: rgb(185 28 28 / .45);
    --danger-solid: #b91c1c; --danger-solid-hover: #991b1b;
    --info-fg: #0369a1; --info-bg: rgb(3 105 161 / .08); --info-bd: rgb(3 105 161 / .45);
    --rec: #dc2626;
    --shadow-md: 0 4px 12px rgb(20 24 40 / .12); --shadow-lg: 0 16px 40px rgb(20 24 40 / .2);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

html { font-size: 100%; }

body {
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: var(--lh-ui);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

[hidden] { display: none !important; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
.skip-link {
  position: fixed; top: 8px; left: 8px; z-index: 100;
  background: var(--accent-solid); color: var(--on-accent);
  padding: 8px 16px; border-radius: var(--radius); font-weight: 600;
  transform: translateY(-200%);
}
.skip-link:focus { transform: none; }

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}
#mainContent:focus, #detailTitle:focus { outline: none; }

.ico {
  width: 16px; height: 16px; flex-shrink: 0;
  fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
}

/* Botones */
button {
  cursor: pointer;
  font: inherit;
  font-size: var(--fs-md);
  font-weight: 500;
  color: inherit;
  background: none;
  border: none;
  border-radius: var(--radius);
  min-height: var(--control-h);
  padding: 0 var(--space-4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), opacity var(--t-fast);
}
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
button.busy:disabled { opacity: .75; }
button.busy::before, .spin {
  content: '';
  width: 14px; height: 14px; flex-shrink: 0;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  animation: spin .7s linear infinite;
}
.spin { display: inline-block; width: 12px; height: 12px; }

.btn-primary, .btn-accent {
  background: var(--accent-solid);
  color: var(--on-accent);
  font-weight: 600;
  white-space: nowrap;
}
.btn-primary:hover, .btn-accent:hover { background: var(--accent-solid-hover); }
.btn-primary:active:not(:disabled), .btn-accent:active:not(:disabled) { background: var(--accent-solid-active); }
.btn-primary { width: 100%; min-height: 44px; }

.btn-sm, .btn-cancel, .btn-icon {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.btn-sm:hover, .btn-cancel:hover, .btn-icon:hover { background: var(--surface3); }
.btn-sm { min-height: 32px; padding: 0 12px; font-size: var(--fs-sm); }
.btn-sm.danger { color: var(--danger-fg); border-color: var(--danger-bd); }
.btn-sm.danger:hover { background: var(--danger-bg); }
.btn-danger { background: var(--danger-solid); color: #fff; font-weight: 600; }
.btn-danger:hover { background: var(--danger-solid-hover); }

.btn-ghost, .btn-close {
  width: 40px; height: 40px; min-height: 0; padding: 0;
  border-radius: var(--radius-sm);
  color: var(--text2);
  background: transparent;
}
.btn-ghost:hover, .btn-close:hover { background: var(--surface3); color: var(--text); }

.link-btn {
  min-height: 0; padding: 4px 0; color: var(--accent);
  text-decoration: underline; text-underline-offset: 2px; background: none;
}

/* Inputs */
input, textarea, select {
  font: inherit;
  font-size: var(--fs-md);
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 0 12px;
  min-height: var(--control-h);
  transition: border-color var(--t-fast);
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--danger-fg); }
input::placeholder, textarea::placeholder { color: var(--text3); }
textarea { resize: vertical; min-height: 80px; padding: 10px 12px; line-height: 1.5; }
select[multiple] { padding: 4px; }
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; padding: 0; accent-color: var(--accent-solid); cursor: pointer; }
input[type="search"]::-webkit-search-cancel-button { display: none; }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label { font-size: var(--fs-sm); font-weight: 500; color: var(--text2); }
.hint { font-size: var(--fs-xs); color: var(--text3); }
.field-error { display: flex; align-items: center; gap: 4px; font-size: var(--fs-sm); color: var(--danger-fg); }
.req { color: var(--danger-fg); }

/* Layout */
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
.main { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

.mobile-bar {
  display: none;
  align-items: center;
  gap: 8px;
  height: 56px;
  flex-shrink: 0;
  padding: 0 8px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.mobile-bar .btn-ghost { width: 44px; height: 44px; }
.mobile-bar .mobile-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.rec-banner {
  display: flex; align-items: center; gap: 12px;
  min-height: 32px; padding: 4px 24px;
  background: var(--danger-bg); border-bottom: 1px solid var(--danger-bd);
  font-size: var(--fs-sm); flex-shrink: 0;
}
.rec-banner.hidden { display: none; }
.rec-banner .link-btn { margin-left: auto; font-size: var(--fs-sm); }
.rec-banner-time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: var(--z-sidebar);
}
.sidebar-scrim { display: none; }

.sidebar-header {
  padding: 24px 16px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.sidebar-header .logo { width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0; object-fit: cover; }
.sidebar-header h1 { font-size: var(--fs-lg); font-weight: 700; color: var(--text); line-height: var(--lh-tight); }
.sidebar-header p { font-size: var(--fs-xs); color: var(--text3); margin-top: 4px; }

.sidebar-actions { padding: 16px 16px 12px; }

.session-search { padding: 0 16px 12px; }
.search-box { position: relative; }
.search-box input { width: 100%; padding: 0 44px 0 40px; }
.search-box .icon {
  position: absolute; left: 12px; top: 0; bottom: 0; margin: auto 0; height: 16px;
  color: var(--text3); pointer-events: none; display: flex;
}
.search-box .clear-btn {
  position: absolute; right: 4px; top: 0; bottom: 0; margin: auto 0;
  width: 32px; height: 32px; display: none;
}
.session-search.has-query .clear-btn { display: inline-flex; }

.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.session-item {
  display: flex;
  align-items: center;
  min-height: 56px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background var(--t-fast);
}
.session-item:hover { background: var(--surface2); }
.session-item.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.session-main {
  flex: 1; min-width: 0; min-height: 56px;
  padding: 12px; gap: 8px;
  justify-content: flex-start;
  text-align: left;
  font-weight: 400;
}
.session-main .info { flex: 1; min-width: 0; display: block; }
.session-item .name {
  display: block; font-size: var(--fs-md); font-weight: 500; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-item .meta { display: block; font-size: var(--fs-xs); color: var(--text3); margin-top: 2px; }
.search-empty { padding: 24px 16px; color: var(--text2); font-size: var(--fs-sm); text-align: center; }
.session-item .badge {
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
  height: 20px; padding: 0 8px; border-radius: var(--radius-pill);
  font-size: var(--fs-xs); font-weight: 600;
}
.session-item .badge .ico { width: 12px; height: 12px; }
.session-item .badge.is-idle { background: var(--surface3); color: var(--text2); }
.session-item .badge.is-done { background: var(--success-bg); color: var(--success-fg); }
.session-item .badge.is-busy { background: var(--warn-bg); color: var(--warn-fg); }
.pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1s infinite; }
.session-item .delete-btn { width: 32px; height: 32px; margin-right: 4px; opacity: .7; flex-shrink: 0; }
.session-item:hover .delete-btn, .session-item:focus-within .delete-btn, .session-item .delete-btn:hover { opacity: 1; }
.session-item .delete-btn:hover, .video-card .delete-btn:hover { color: var(--danger-fg); }

/* Empty / skeleton */
.empty-state {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 40px 24px;
  color: var(--text2); line-height: var(--lh-prose);
}
.empty-state > * { max-width: 420px; }
.es-icon {
  width: 80px; height: 80px; border-radius: 50%; background: var(--surface2);
  display: flex; align-items: center; justify-content: center; color: var(--text3);
}
.es-icon .ico { width: 40px; height: 40px; stroke-width: 1.5; }
.es-title { font-size: var(--fs-lg); font-weight: 600; color: var(--text); }
.es-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }

.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: var(--radius-sm);
}
.sk-row { height: 56px; margin-bottom: 4px; border-radius: var(--radius); }
.sk-title { height: 20px; width: 40%; margin-bottom: 20px; }
.sk-line { height: 12px; margin-bottom: 12px; }
.sk-line:nth-child(3n) { width: 92%; }
.sk-line:nth-child(3n+1) { width: 70%; }

/* Sesión */
.session-view {
  --pad-x: max(24px, calc((100% - 1100px) / 2));
  flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
}

.session-top {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  align-items: center;
  padding: 24px var(--pad-x) 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: var(--z-sticky);
  flex-shrink: 0;
}
.session-title { min-width: 0; }
.session-top h2 {
  font-size: var(--fs-xl); font-weight: 600; line-height: var(--lh-tight);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-top .instructions-preview {
  display: flex; gap: 8px; align-items: flex-start;
  font-size: var(--fs-md); color: var(--text2); margin-top: 8px; max-width: 72ch;
}
.session-top .instructions-preview .ico { margin-top: 2px; }
.session-top .instructions-preview span {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.session-actions { display: flex; align-items: center; gap: 12px; }

.rec-group { display: flex; align-items: center; gap: 12px; }
.rec-indicator {
  width: 12px; height: 12px; border-radius: 50%; background: var(--rec); flex-shrink: 0;
  box-shadow: 0 0 0 0 rgb(255 77 77 / .6);
  animation: rec-pulse 1.4s ease-out infinite;
}
.recording-timer {
  font-family: var(--font-mono); font-size: var(--fs-base); font-weight: 600;
  font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; color: var(--text);
}
.btn-sm.btn-record { min-height: var(--control-h); font-weight: 600; white-space: nowrap; }
.btn-record .ico-rec { color: var(--rec); width: 10px; height: 10px; }
.btn-record.active { background: var(--danger-solid); border-color: var(--danger-solid); color: #fff; }
.btn-record.active .ico-rec { color: #fff; }
.btn-record.active:hover { background: var(--danger-solid-hover); }
.btn-record.dead { border-color: var(--warn-fg); box-shadow: 0 0 0 2px var(--warn-bd); }

.inline-alert {
  display: flex; align-items: center; gap: 8px;
  margin: 16px var(--pad-x) 0; padding: 12px 16px;
  background: var(--warn-bg); border: 1px solid var(--warn-bd); color: var(--warn-fg);
  border-radius: var(--radius); font-size: var(--fs-md); flex-shrink: 0;
}

.add-video-bar {
  margin: 16px var(--pad-x);
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: grid;
  grid-template-columns: minmax(220px, 1fr) 160px auto auto;
  gap: 16px;
  align-items: end;
  flex-shrink: 0;
}
.add-video-bar textarea { min-height: var(--control-h); height: var(--control-h); padding: 9px 12px; resize: none; overflow-y: hidden; }
.add-video-bar select { width: 100%; }
.check { display: flex; align-items: center; gap: 8px; min-height: var(--control-h); cursor: pointer; color: var(--text); font-size: var(--fs-md); }

/* Lista de videos */
.video-list { flex: 1; overflow-y: auto; padding: 0 var(--pad-x) 24px; }

.video-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  min-height: 72px;
  padding: 16px 16px 16px 20px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.video-card:hover { border-color: var(--border-strong); background: var(--surface2); }
.video-card.selected { border-color: var(--accent); background: var(--accent-soft); }
.video-card .status-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.status-dot.queued { background: var(--text3); }
.status-dot.extracting_audio, .status-dot.transcribing, .status-dot.summarizing, .status-dot.analyzing_visual {
  background: var(--info-fg); animation: pulse 1s infinite;
}
.status-dot.done { background: var(--success-fg); }
.status-dot.error { background: var(--danger-fg); }
.status-dot.small { width: 8px; height: 8px; display: inline-block; margin-right: 6px; }

.video-card .info { flex: 1; min-width: 0; }
.video-card .info .vname {
  display: flex; align-items: center; gap: 8px;
  font-size: var(--fs-md); font-weight: 500;
}
.video-card .info .vname > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.video-card .info .vname .ico { color: var(--text3); }
.video-card .info .vpath {
  font-size: var(--fs-xs); color: var(--text3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.vpath.chip { display: flex; align-items: center; gap: 4px; }
.vprogress { margin-top: 8px; max-width: 320px; }
.vsteps { display: flex; gap: 4px; }
.vstep { flex: 1; height: 4px; border-radius: var(--radius-pill); background: var(--surface3); }
.vstep.done { background: var(--success-fg); }
.vstep.current {
  background: linear-gradient(90deg, var(--info-fg) 25%, color-mix(in srgb, var(--info-fg) 55%, #fff) 50%, var(--info-fg) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
.video-card .info .vstatus { font-size: var(--fs-xs); color: var(--text2); margin-top: 4px; }

.status-text-queued { color: var(--text2); }
.status-text-extracting_audio, .status-text-transcribing, .status-text-summarizing, .status-text-analyzing_visual { color: var(--info-fg); }
.status-text-done { color: var(--success-fg); }
.status-text-error { color: var(--danger-fg); }

.badge-status {
  display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
  height: 24px; padding: 0 10px; border-radius: var(--radius-pill);
  font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
}
.badge-status .ico { width: 14px; height: 14px; }
.badge-status.status-text-queued { background: var(--surface3); }

  return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function announce(msg, id = 'liveStatus') {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 50);
}

function setBusy(btn, on) {
  if (!btn) return;
  btn.disabled = on;
  btn.classList.toggle('busy', on);
  btn.setAttribute('aria-busy', on);
}

function setFieldError(input, errorSel, msg) {
  const err = $(errorSel);
  input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  err.hidden = !msg;
  err.innerHTML = msg ? `${icon('alert')}${escapeHtml(msg)}` : '';
  if (msg) input.focus();
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight + 2, 112) + 'px';
  el.style.overflowY = el.scrollHeight > 112 ? 'auto' : 'hidden';
}

async function api(url, opts = {}) {
  const res = await fetch(API + url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Error del servidor');
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}

/* Toasts */
function toastRegion() {
  let region = $('#toastRegion');
  if (!region) {
    region = document.createElement('div');
    region.id = 'toastRegion';
    region.className = 'toast-region';
    region.setAttribute('aria-live', 'polite');
    region.setAttribute('aria-atomic', 'false');
    document.body.appendChild(region);
  }
  return region;
}

function toast(msg, type = 'success') {
  const region = toastRegion();
  while (region.children.length >= 3) region.firstChild.remove();
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  if (type === 'error') el.setAttribute('role', 'alert');
  const lead = { success: 'check', error: 'alert', warn: 'alert', info: 'info' }[type] || 'info';
  el.innerHTML = `${icon(lead)}<span class="toast-msg"></span>` +
    `<button class="btn-ghost toast-close" aria-label="Cerrar notificación">${icon('x')}</button>`;
  el.querySelector('.toast-msg').textContent = msg;
  region.appendChild(el);
  scheduleToastClose(el, { success: 4000, info: 5000, warn: 6000, error: 8000 }[type] || 4000);
}

function scheduleToastClose(el, duration) {
  let left = duration, startedAt = 0, timer = null;
  const close = () => { clearTimeout(timer); el.classList.add('leaving'); setTimeout(() => el.remove(), 150); };
  const start = () => { if (timer) return; startedAt = Date.now(); timer = setTimeout(close, left); };
  const pause = () => { if (!timer) return; clearTimeout(timer); timer = null; left -= Date.now() - startedAt; };
  el.addEventListener('mouseenter', pause);
  el.addEventListener('focusin', pause);
  el.addEventListener('mouseleave', () => { if (!el.matches(':focus-within')) start(); });
  el.addEventListener('focusout', () => { if (!el.matches(':hover')) start(); });
  el.querySelector('.toast-close').addEventListener('click', close);
  start();
}

/* Confirmación propia (reemplaza confirm()) */
let activeConfirm = null;
let confirmQueue = Promise.resolve();

function confirmDialog(opts) {
  const p = confirmQueue.then(() => showConfirm(opts));
  confirmQueue = p;
  return p;
}

function showConfirm({ title, message, confirmLabel = 'Confirmar', cancelLabel = 'Cancelar', danger = false }) {
  return new Promise(resolve => {
    const opener = document.activeElement;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay confirm-overlay';
    overlay.innerHTML = `
      <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
        <h3 id="confirmTitle"></h3>
        <p class="confirm-msg" id="confirmMsg"></p>
        <div class="modal-actions">
          <button class="btn-cancel"></button>
          <button class="${danger ? 'btn-danger' : 'btn-accent'}"></button>
        </div>
      </div>`;
    overlay.querySelector('h3').textContent = title;
    overlay.querySelector('.confirm-msg').textContent = message;
    const [cancel, ok] = overlay.querySelectorAll('button');
    cancel.textContent = cancelLabel;
    ok.textContent = confirmLabel;
    const close = (result) => {
      activeConfirm = null;
      overlay.remove();
      if (opener && opener.isConnected) opener.focus();
      resolve(result);
    };
    activeConfirm = close;
    cancel.onclick = () => close(false);
    ok.onclick = () => close(true);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
    document.body.appendChild(overlay);
    cancel.focus();
  });
}

// Devuelve una función que devuelve el foco al mismo elemento tras reemplazar innerHTML.
function captureFocus(container, key) {
  const a = document.activeElement;
  const item = a && container.contains(a) ? a.closest(`[data-${key}]`) : null;
  if (!item) return () => {};
  const id = item.dataset[key];
  const act = a !== item && a.dataset.act ? `[data-act="${a.dataset.act}"]` : '';
  return () => {
    const root = container.querySelector(`[data-${key}="${CSS.escape(id)}"]`);
    const target = act ? root?.querySelector(act) : root;
    if (target) target.focus({ preventScroll: true });
  };
}

function sessionBadge(s) {
  const total = s.videos.length;
  if (!total) return '';
  const done = s.videos.filter(v => v.status === 'done').length;
  const busy = s.videos.some(v => ACTIVE_STATES.includes(v.status));
  const complete = done === total;
  const kind = busy ? 'busy' : complete ? 'done' : 'idle';
  const lead = busy ? '<span class="pulse-dot" aria-hidden="true"></span>' : complete ? icon('check') : '';
  return `<span class="badge is-${kind} status-text-${complete ? 'done' : 'queued'}">${lead}${done}/${total}<span class="sr-only"> completados</span></span>`;
}

function sessionItemHtml(s) {
  const active = s.id === state.activeSessionId;

      <button class="session-main" data-act="open" title="${name}"${active ? ' aria-current="true"' : ''}>
        <span class="info">
          <span class="name">${name}</span>
          <span class="meta">${s.videos.length} video${s.videos.length === 1 ? '' : 's'} · ${new Date(s.created_at).toLocaleDateString('es')}</span>
        </span>
        ${sessionBadge(s)}

}

function sidebarHtml() {
  if (state.sessions.length === 0) {
    return '<div class="search-empty">Sin sesiones<br><button class="link-btn" onclick="openNewSessionModal()">Crear la primera</button></div>';
  }
  const sessions = filteredSessions();

      '<button class="link-btn" onclick="clearSessionSearch()">Limpiar búsqueda</button></div>';

}

function renderSidebar() {
  const list = $('#sessionList');
  list.setAttribute('aria-busy', 'false');
  const html = sidebarHtml();
  announceSearchResults();
  if (list._html === html) return;
  const restoreFocus = captureFocus(list, 'sid');
  list._html = html;
  list.innerHTML = html;
  restoreFocus();
}

function toggleSidebar() {

  $('#sidebarScrim').classList.remove('show');

  const elapsed = recording ? fmtElapsed(Math.floor((Date.now() - recording.startedAt.getTime()) / 1000)) : '';
  const name = escapeHtml(session.name);

  const main = $('#mainContent');
  main.innerHTML = `
    <div class="session-view">

function videoProgressHtml(v) {
  const steps = v.analyze_visual ? ACTIVE_STATES : ACTIVE_STATES.filter(s => s !== 'analyzing_visual');
  const idx = steps.indexOf(v.status);
  if (idx < 0) return '';
  const segs = steps.map((_, i) => `<span class="vstep${i < idx ? ' done' : i === idx ? ' current' : ''}"></span>`).join('');
  const label = `Paso ${idx + 1} de ${steps.length} · ${statusLabel(v.status)}`;
  return `
    <div class="vprogress">
      <div class="vsteps" role="progressbar" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${idx + 1}" aria-valuetext="${label}" aria-label="Progreso: ${statusLabel(v.status)}">${segs}</div>
      <div class="vstatus">${label}</div>
    </div>`;
}

function statusBadgeHtml(status) {
  const lead = ACTIVE_STATES.includes(status) ? '<span class="spin" aria-hidden="true"></span>' : icon(STATUS_ICON[status] || 'clock');
  return `<span class="badge-status status-text-${status}">${lead}${statusLabel(status)}</span>`;
}

    : `<div class="vpath" title="${escapeHtml(v.original_path)}">${escapeHtml(v.original_path)}</div>`;
  return `
    <article class="video-card${sel}" data-vid="${v.id}" tabindex="0" role="group" aria-label="${name}, ${statusLabel(v.status)}" onclick="selectVideo('${v.id}')" onkeydown="onCardKey(event,'${v.id}')">

      <div class="info">
        <div class="vname"><span>${name}</span>${v.analyze_visual ? `<span title="Con análisis visual">${icon('monitor')}<span class="sr-only">Con análisis visual</span></span>` : ''}</div>
        ${path}
        ${videoProgressHtml(v)}
      </div>
      ${statusBadgeHtml(v.status)}
      <div class="actions">
        ${v.status === 'error' ? `<button class="btn-sm" data-act="retry" onclick="event.stopPropagation();retryVideo('${v.id}')">Reintentar</button>` : ''}
        ${v.status === 'done' ? `<button class="btn-sm" data-act="view" onclick="event.stopPropagation();selectVideo('${v.id}')">Ver</button>` : ''}
        <button class="btn-ghost delete-btn" data-act="delete" aria-label="Eliminar ${name}" onclick="event.stopPropagation();deleteVideo('${v.id}')">${icon('trash')}</button>
      </div>
    </article>`;
}

function renderVideoCards(videos) {
  return [...videos].reverse().map(videoCardHtml).join('');
}

function onCardKey(e, vid) {
  if (e.target !== e.currentTarget) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    selectVideo(vid);
  }
}

async function addVideos() {
  const input = $('#videoPathsInput');
  const lang = $('#videoLanguage');
  const raw = input.value;
  if (!raw.trim()) { setFieldError(input, '#videoPathsError', 'Ingresa al menos una ruta'); return; }
  setFieldError(input, '#videoPathsError', '');

  const paths = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  const analyzeVisual = $('#videoAnalyzeVisual')?.checked || false;
  const btn = $('#btnAddVideos');
  setBusy(btn, true);
  try {
    const res = await api(`/sessions/${state.activeSessionId}/videos`, {
      method: 'POST',
      body: JSON.stringify({ paths, language: lang.value, analyze_visual: analyzeVisual }),
    });
    input.value = '';
    await loadSessions();
    renderSessionView();
    toast(`${res.added.length} video(s) agregados`);
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    setBusy(btn, false);
  }
}

async function retryVideo(vid) {
  try {
    await api(`/sessions/${state.activeSessionId}/videos/${vid}/retry`, { method: 'POST' });
    await loadSessions();
    renderSessionView();
    toast('Video reencolado');
    announce('Video reencolado');
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteVideo(vid) {
  const session = state.sessions.find(s => s.id === state.activeSessionId);
  const video = session?.videos.find(v => v.id === vid);
  const ok = await confirmDialog({
    title: 'Eliminar video',
    message: `Se eliminará ${video ? `"${video.name}"` : 'este video'} y sus resultados (transcripción, resumen y análisis). No se puede deshacer.`,
    confirmLabel: 'Eliminar',
    danger: true,
  });
  if (!ok) return;
  try {
    await api(`/sessions/${state.activeSessionId}/videos/${vid}`, { method: 'DELETE' });
    if (state.activeVideoId === vid) closeDetail();
    await loadSessions();
    renderSessionView();
    toast('Video eliminado');
  } catch (e) {
    toast(e.message, 'error');
  }
}

function selectVideo(vid) {

async function loadDetailContent(tab) {
  const sid = state.activeSessionId;
  const vid = state.activeVideoId;
  if (!sid || !vid) return;

  const content = $('#detailContent');
  const toolbar = $('#detailToolbar');

  if (tab === 'save') {
    toolbar.style.display = 'none';
    content.innerHTML = saveFormHtml();
    return;
  }

  toolbar.style.display = 'flex';
  content.setAttribute('aria-busy', 'true');
  content.innerHTML = loadingHtml();

  try {
    const endpoints = {
      summary: `/sessions/${sid}/videos/${vid}/summary`,
      analysis: `/sessions/${sid}/videos/${vid}/analysis`,
      transcript: `/sessions/${sid}/videos/${vid}/transcript`,
      visual: `/sessions/${sid}/videos/${vid}/visual`,
    };

    const ep = endpoints[tab];
    if (!ep) { content.innerHTML = '<div class="empty"><p>No disponible</p></div>'; return; }

    const data = await api(ep);
    if (!data.text || !data.text.trim()) {
      content.innerHTML = emptyDetailHtml();
      return;
    }

    state.currentDetailText = data.text;
    renderDetailViews();
  } catch (e) {
    toolbar.style.display = 'none';
    content.innerHTML = `
      <div class="detail-error" role="alert">${icon('alert')}
        <div><p>No disponible: ${escapeHtml(e.message)}</p>
        <button class="btn-sm" onclick="loadDetailContent(state.activeDetailTab)">Reintentar</button></div>
      </div>`;
  } finally {
    content.setAttribute('aria-busy', 'false');
  }
}

function enhanceMarkdown(root) {
  root.querySelectorAll('table').forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    wrap.tabIndex = 0;
    wrap.setAttribute('role', 'region');
    wrap.setAttribute('aria-label', 'Tabla');
    t.replaceWith(wrap);
    wrap.appendChild(t);
  });
  root.querySelectorAll('pre').forEach(p => p.setAttribute('tabindex', '0'));
}

function renderDetailViews() {
  const content = $('#detailContent');
  const text = state.currentDetailText;

  if (state.viewMode === 'preview') {
    try {
      const html = marked.parse(text);
      content.innerHTML = `<div class="md-preview">${html}</div>`;
      enhanceMarkdown(content);
    } catch (e) {
      content.innerHTML = `<div class="md-raw">${escapeHtml(text)}</div>`;
    }
  } else {
    content.innerHTML = `<div class="md-raw">${escapeHtml(text)}</div>`;
  }
}

function setViewMode(mode) {
  state.viewMode = mode;
  $('#btnViewPreview').classList.toggle('active', mode === 'preview');
  $('#btnViewRaw').classList.toggle('active', mode === 'raw');
  $('#btnViewPreview').setAttribute('aria-pressed', mode === 'preview');
  $('#btnViewRaw').setAttribute('aria-pressed', mode === 'raw');
  if (state.currentDetailText) {
    renderDetailViews();
  }
}

async function copyContent() {
  try {
    await navigator.clipboard.writeText(state.currentDetailText);
    const btn = document.querySelector('.btn-icon');
    const orig = btn.innerHTML;
    btn.innerHTML = `${icon('check')} Copiado!`;
    btn.style.color = 'var(--green)';
    announce('Copiado');
    setTimeout(() => { btn.innerHTML = orig; btn.style.color = ''; }, 1500);
  } catch {
    toast('Error al copiar', 'error');
  }
}

async function saveOutput() {
  const sid = state.activeSessionId;
  const vid = state.activeVideoId;
  const dirInput = $('#saveTargetDir');
  const targetDir = dirInput.value.trim();
  const filesSelect = $('#saveFiles');
  const files = Array.from(filesSelect.selectedOptions).map(o => o.value);

  dirInput.setAttribute('aria-invalid', targetDir ? 'false' : 'true');
  if (!targetDir) { toast('Ingresa un directorio destino', 'error'); dirInput.focus(); return; }

  try {
    const res = await api(`/sessions/${sid}/videos/${vid}/save`, {
      method: 'POST',
      body: JSON.stringify({ target_dir: targetDir, files }),
    });
    $('#saveResult').innerHTML = res.saved.map(f =>
      `<div class="save-item">${icon('check')}${escapeHtml(f)}</div>`
    ).join('');
    toast(`${res.saved.length} archivo(s) guardados`);
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* Modal nueva sesión */
let sessionModalOpener = null;

function openNewSessionModal() {
  sessionModalOpener = document.activeElement;
  $('#sessionModal').classList.remove('hidden');
  $('#newSessionName').focus();
}

function closeNewSessionModal() {
  $('#sessionModal').classList.add('hidden');
  $('#newSessionName').value = '';
  $('#newSessionInstructions').value = '';
  setFieldError($('#newSessionName'), '#newSessionNameError', '');
  if (sessionModalOpener && sessionModalOpener.isConnected) sessionModalOpener.focus();
  sessionModalOpener = null;
}

function onSessionModalBackdrop(e) {
  if (e.target !== e.currentTarget) return;
  if (!$('#newSessionName').value && !$('#newSessionInstructions').value) closeNewSessionModal();
}

async function createSession() {
  const nameInput = $('#newSessionName');
  const name = nameInput.value.trim();
  if (!name) { setFieldError(nameInput, '#newSessionNameError', 'El nombre es obligatorio'); return; }
  setFieldError(nameInput, '#newSessionNameError', '');
  const instructions = $('#newSessionInstructions').value.trim();
  const btn = $('#btnCreateSession');
  setBusy(btn, true);
  try {
    const session = await api('/sessions', {
      method: 'POST',
      body: JSON.stringify({ name, instructions }),
    });
    closeNewSessionModal();
    await loadSessions();
    selectSession(session.id);
    toast('Sesión creada');
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    setBusy(btn, false);
  }
}

async function deleteSession(sid) {
  const session = state.sessions.find(s => s.id === sid);
  const count = session ? session.videos.length : 0;
  const ok = await confirmDialog({
    title: 'Eliminar sesión',
    message: `Se eliminará ${session ? `"${session.name}"` : 'esta sesión'}` +
      `${count ? ` junto con sus ${count} video(s) y resultados` : ''}. No se puede deshacer.`,
    confirmLabel: 'Eliminar',
    danger: true,
  });
  if (!ok) return;
  try {
    await api(`/sessions/${sid}`, { method: 'DELETE' });
    if (state.activeSessionId === sid) {
      state.activeSessionId = null;
      state.activeVideoId = null;
      closeDetail();
      $('#mainContent').innerHTML = emptyMainHtml();
      setMobileTitle('Video Reviewer');
    }
    await loadSessions();
    toast('Sesión eliminada');
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* Grabación */
function fmtElapsed(secs) {
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = secs % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function updateRecBanner() {
  const banner = $('#recBanner');
  const r = state.recording;
  if (!r || r.sid === state.activeSessionId) {
    banner.classList.add('hidden');
    banner.innerHTML = '';
    return;
  }
  const session = state.sessions.find(s => s.id === r.sid);
  const elapsed = fmtElapsed(Math.floor((Date.now() - r.startedAt.getTime()) / 1000));
  banner.classList.remove('hidden');
  banner.innerHTML = `<span class="rec-indicator" aria-hidden="true"></span>` +
    `<span>Grabando${session ? ` sesión ${escapeHtml(session.name)}` : ''}</span>` +
    `<span class="rec-banner-time" id="recBannerTime">${elapsed}</span>` +
    `<button class="link-btn" onclick="selectSession('${r.sid}')">Ir a la sesión</button>`;
}

function startRecordingTimer() {
  stopRecordingTimer();
  state.recordingTimerId = setInterval(() => {
    const el = $('#recordingTimer');
    const bannerTime = $('#recBannerTime');
    if (!state.recording) return;
    const text = fmtElapsed(Math.floor((Date.now() - state.recording.startedAt.getTime()) / 1000));
    if (bannerTime) bannerTime.textContent = text;
    if (el) el.textContent = text;
  }, 1000);
}

function stopRecordingTimer() {
  if (state.recordingTimerId) { clearInterval(state.recordingTimerId); state.recordingTimerId = null; }
}

async function checkActiveRecording(sid) {
  try {
    const status = await api('/record/status');
    const entry = Object.entries(status).find(([, r]) => r.session_id === sid);
    if (entry) {
      const [rid, r] = entry;
      state.recording = { sid, rid, startedAt: new Date(r.started_at), alive: r.alive, size: r.size_bytes };
      warnIfRecorderDied(r);
    } else {
      if (state.recording && state.recording.sid === sid) {
        state.recording = null;
        stopRecordingTimer();
      }
      await recoverOrphanRecordings(sid);
    }
  } catch (e) { /* servidor sin este endpoint aún, ignorar */ }
}

function warnIfRecorderDied(r) {
  if (r.alive === false && !state.recorderDeathWarned) {
    state.recorderDeathWarned = true;
    toast('El grabador se detuvo inesperadamente. Pulsa "Detener" para guardar lo grabado.', 'error');
  }
}

async function recoverOrphanRecordings(sid) {
  try {
    const res = await api(`/sessions/${sid}/record/recover`, { method: 'POST' });
    if (res.recovered.length) {
      toast(`Grabaciones recuperadas: ${res.recovered.length}, procesando en background`);
      await loadSessions();
      renderSessionView();
    }
  } catch (e) { /* best-effort */ }
}

async function toggleRecording() {
  if (state.recordingBusy) return;
  state.recordingBusy = true;
  try {
    if (state.recording && state.recording.sid === state.activeSessionId) {
      await stopRecording();
    } else {
      await startRecording();
    }
  } finally {
    state.recordingBusy = false;
  }
}

async function startRecording() {
  const sid = state.activeSessionId;
  if (!sid) return;
  try {
    const res = await api(`/sessions/${sid}/record/start`, { method: 'POST' });
    state.recording = { sid, rid: res.recording_id, startedAt: new Date(res.started_at) };
    state.recorderDeathWarned = false;
    renderSessionView();
    announce('Grabación iniciada', 'recStatus');
    toast('Grabando — elige pantalla/ventana en el diálogo del sistema');
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function stopRecording() {
  const sid = state.recording?.sid;
  const rid = state.recording?.rid;
  if (!sid || !rid) return;
  const btn = document.querySelector('.btn-record');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Finalizando...';
    btn.classList.add('busy');
    btn.setAttribute('aria-busy', 'true');
  }
  toast('Finalizando grabación (puede tardar en grabaciones largas)...', 'info');
  try {
    await api(`/sessions/${sid}/record/${rid}/stop`, {
      method: 'POST',
      body: JSON.stringify({ analyze_visual: true }),
    });
    announce('Grabación detenida, procesando', 'recStatus');
    toast('Grabación agregada, procesando en background');
  } catch (e) {
    // Never leave the UI stuck on "Detener": the server keeps the file and
    // recovers it, so resync instead of retrying a dead recording id.
    toast(`${e.message}. Se intentará recuperar la grabación.`, 'error');
    await recoverOrphanRecordings(sid);
  } finally {
    stopRecordingTimer();
    state.recording = null;
    await loadSessions();
    renderSessionView();
  }
}

function checkRecordingCleanup() {
  for (const s of state.sessions) {
    for (const v of s.videos) {
      if (v.is_recording && v.status === 'done' && !v.original_deleted
          && !state.recordingPrompted.has(v.id)) {
        state.recordingPrompted.add(v.id);
        promptDeleteRecording(s.id, v);
      }
    }
  }
}

async function promptDeleteRecording(sid, video) {
  const del = await confirmDialog({
    title: 'Eliminar grabación mp4',
    message: `Análisis de "${video.name}" completo. ¿Eliminar el archivo de grabación (mp4) para liberar espacio? ` +
      'El resumen, análisis y transcripción se conservan.',
    confirmLabel: 'Eliminar mp4',
    cancelLabel: 'Conservar mp4',
    danger: true,
  });
  if (!del) return;
  try {
    await api(`/sessions/${sid}/videos/${video.id}/recording`, { method: 'DELETE' });
    toast('Grabación mp4 eliminada, análisis conservado');
    await loadSessions();
    if (state.activeSessionId === sid) renderSessionView();
  } catch (e) {
    toast(e.message, 'error');
  }
}

/* SSE */
function announceTransitions(sessions) {
  for (const s of sessions) {
    for (const v of s.videos) {
      const prev = state.videoStatus[v.id];
      if (prev && prev !== v.status && (v.status === 'done' || v.status === 'error')) {
        announce(`${v.name}: ${statusLabel(v.status)}`);
      }
      state.videoStatus[v.id] = v.status;
    }
  }
}

function refreshVideoList(session) {
  const videoList = $('#videoList');
  if (!videoList) return;
  const html = session.videos.length === 0 ? emptyVideosHtml() : renderVideoCards(session.videos);
  if (videoList._html === html) return;
  const restoreFocus = captureFocus(videoList, 'vid');
  videoList._html = html;
  videoList.innerHTML = html;
  restoreFocus();
}

function startSSE() {
  const es = new EventSource(API + '/progress');
  es.onmessage = (e) => {
    try {
      const sessions = JSON.parse(e.data);
      state.sessions = sessions;
      announceTransitions(sessions);
      renderSidebar();
      checkRecordingCleanup();
      const session = state.activeSessionId && state.sessions.find(s => s.id === state.activeSessionId);
      if (session) refreshVideoList(session);
    } catch (ex) {}
  };
  es.onerror = () => { es.close(); setTimeout(startSSE, 3000); };
}

/* Teclado global */
function trapTab(e, root) {
  const items = [...root.querySelectorAll(FOCUSABLE)].filter(el => el.getClientRects().length);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  const inside = root.contains(document.activeElement);
  if (e.shiftKey && (!inside || document.activeElement === first)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (!inside || document.activeElement === last)) { e.preventDefault(); first.focus(); }
}

function activeFocusRoot() {
  const confirmEl = $('.confirm-overlay');
  if (confirmEl) return confirmEl;
  if (!$('#sessionModal').classList.contains('hidden')) return $('#sessionModal');
  if (!$('#detailPanel').classList.contains('hidden') && narrowDetail.matches) return $('#detailPanel');
  if ($('#sidebar').classList.contains('open')) return $('#sidebar');
  return null;
}

function isTypingTarget(el) {
  return el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

function focusSearchShortcut(e) {
  if (e.ctrlKey || e.metaKey || e.altKey || isTypingTarget(e.target) || activeFocusRoot()) return;
  e.preventDefault();
  if (!desktopMedia.matches) openSidebar();
  $('#sessionSearchInput').focus();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    const root = activeFocusRoot();
    if (root) trapTab(e, root);
  } else if (e.key === '/') {
    focusSearchShortcut(e);
  } else if (e.key === 'Escape') {
    if (activeConfirm) activeConfirm(false);
    else if (!$('#sessionModal').classList.contains('hidden')) closeNewSessionModal();
    else if ($('#sidebar').classList.contains('open')) closeSidebar();
    else if (!$('#detailPanel').classList.contains('hidden')) closeDetail();
  }
});

$('.detail-tabs').addEventListener('keydown', (e) => {
  const tabs = [...$$('.detail-tabs button')];
  const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  const next = { ArrowRight: (i + 1) % tabs.length, ArrowLeft: (i - 1 + tabs.length) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key];
  if (next === undefined) return;
  e.preventDefault();
  tabs[next].focus();
  switchDetailTab(tabs[next].dataset.tab);
});

desktopMedia.addEventListener('change', (e) => { if (e.matches) closeSidebar(); });

toastRegion();
$('#mainContent').innerHTML = emptyMainHtml();
loadSessions().then(() => {
  if (state.sessions.length > 0) {
    selectSession(state.sessions[0].id);
  }
});
startSSE();
</script>
