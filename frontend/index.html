<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Reviewer — Estudio de Análisis IA</title>
<link rel="icon" type="image/png" href="/assets/devpaul.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script>
if (typeof marked !== 'undefined') {
  marked.setOptions({ breaks: true, gfm: true });
  marked.use({ renderer: {
    html({ text }) { return escapeHtml(text); },
    link({ href, title, tokens }) {
      const inner = this.parser.parseInline(tokens);
      if (!/^(https?:|mailto:|#|\/)/i.test(href)) return inner;
      const t = title ? ` title="${escapeHtml(title)}"` : '';
      return `<a href="${escapeHtml(href)}"${t} target="_blank" rel="noopener noreferrer">${inner}</a>`;
    },
  } });
}
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root, [data-theme="dark"] {
  color-scheme: dark;

  /* Legacy tokens preserved for compatibility */
  --bg: #090b10;
  --surface: #11141d;
  --surface2: #171b26;
  --surface3: #1f2433;
  --surface-elevated: #1b202e;
  --border: #232838;
  --border-subtle: #1a1f2c;
  --border-strong: #38415a;

  --text: #f1f3f9;
  --text2: #9ba3b8;
  --text3: #687089;

  --accent: #6384ff;
  --accent2: #4768fa;
  --accent-solid: #4768fa;
  --accent-solid-hover: #3b5bdb;
  --accent-solid-active: #2f4ac2;
  --on-accent: #ffffff;
  --accent-soft: rgba(99, 132, 255, 0.13);
  --accent-border: rgba(99, 132, 255, 0.35);
  --focus-ring: #7b98ff;

  --green: #34d399;
  --yellow: #fbbf24;
  --red: #f87171;

  --success-fg: #34d399; --success-bg: rgba(52, 211, 153, 0.11); --success-bd: rgba(52, 211, 153, 0.32);
  --warn-fg: #fbbf24; --warn-bg: rgba(251, 191, 36, 0.11); --warn-bd: rgba(251, 191, 36, 0.32);
  --danger-fg: #f87171; --danger-bg: rgba(248, 113, 113, 0.11); --danger-bd: rgba(248, 113, 113, 0.35);
  --danger-solid: #dc2626; --danger-solid-hover: #b91c1c;
  --info-fg: #38bdf8; --info-bg: rgba(56, 189, 248, 0.11); --info-bd: rgba(56, 189, 248, 0.32);
  --rec: #ef4444;

  --scrim: rgba(4, 6, 12, 0.72);
  --header-glass: rgba(17, 20, 29, 0.84);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.42);
  --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.65);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 24px; --space-6: 32px; --space-7: 40px; --space-8: 48px;

  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;

  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.875rem;
  --fs-base: 0.9375rem;
  --fs-lg: 1.0625rem;
  --fs-xl: 1.25rem;
  --fs-2xl: 1.5rem;

  --lh-tight: 1.25;
  --lh-ui: 1.45;
  --lh-prose: 1.72;

  --radius-sm: 6px;
  --radius: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-pill: 999px;

  --z-sticky: 10;
  --z-sidebar: 30;
  --z-detail: 40;
  --z-scrim: 50;
  --z-modal: 60;
  --z-toast: 80;

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast: 140ms var(--ease);
  --t-base: 220ms var(--ease);

  --sidebar-w: 304px;
  --detail-w: min(680px, 48vw);
  --control-h: 36px;
}

[data-theme="light"] {
  color-scheme: light;

  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface2: #eef1f8;
  --surface3: #e2e7f2;
  --surface-elevated: #ffffff;
  --border: #dde2ee;
  --border-subtle: #e8ecf5;
  --border-strong: #b4bdd4;

  --text: #0f1420;
  --text2: #4b5569;
  --text3: #6e7891;

  --accent: #3656e8;
  --accent2: #2b47c9;
  --accent-solid: #3656e8;
  --accent-solid-hover: #2b47c9;
  --accent-solid-active: #2139ab;
  --on-accent: #ffffff;
  --accent-soft: rgba(54, 86, 232, 0.09);
  --accent-border: rgba(54, 86, 232, 0.3);
  --focus-ring: #3656e8;

  --green: #059669;
  --yellow: #b45309;
  --red: #dc2626;

  --success-fg: #047857; --success-bg: rgba(5, 150, 105, 0.09); --success-bd: rgba(5, 150, 105, 0.3);
  --warn-fg: #b45309; --warn-bg: rgba(180, 83, 9, 0.09); --warn-bd: rgba(180, 83, 9, 0.3);
  --danger-fg: #dc2626; --danger-bg: rgba(220, 38, 38, 0.08); --danger-bd: rgba(220, 38, 38, 0.3);
  --danger-solid: #dc2626; --danger-solid-hover: #b91c1c;
  --info-fg: #0284c7; --info-bg: rgba(2, 132, 199, 0.09); --info-bd: rgba(2, 132, 199, 0.3);
  --rec: #dc2626;

  --scrim: rgba(15, 20, 32, 0.42);
  --header-glass: rgba(255, 255, 255, 0.88);

  --shadow-sm: 0 1px 2px rgba(15, 20, 32, 0.06);
  --shadow-md: 0 6px 18px rgba(15, 20, 32, 0.1);
  --shadow-lg: 0 20px 48px rgba(15, 20, 32, 0.18);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}

html { font-size: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: var(--lh-ui);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* Custom subtle scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-pill); }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }

[hidden] { display: none !important; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}
.skip-link {
  position: fixed; top: 8px; left: 8px; z-index: 100;
  background: var(--accent-solid); color: var(--on-accent);
  padding: 8px 16px; border-radius: var(--radius); font-weight: 600;
  transform: translateY(-200%);
  text-decoration: none;
}
.skip-link:focus { transform: none; }

:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}
#mainContent:focus, #detailTitle:focus { outline: none; }

.ico {
  width: 16px; height: 16px; flex-shrink: 0;
  fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
}

kbd.shortcut {
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  font-weight: 500;
  line-height: 1;
  padding: 3px 5px;
  border-radius: 4px;
  background: var(--surface3);
  color: var(--text2);
  border: 1px solid var(--border);
  box-shadow: 0 1px 0 var(--border);
}

/* Buttons */
button {
  cursor: pointer;
  font: inherit;
  font-size: var(--fs-sm);
  font-weight: 500;
  color: inherit;
  background: none;
  border: 1px solid transparent;
  border-radius: var(--radius);
  min-height: var(--control-h);
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast), box-shadow var(--t-fast), transform var(--t-fast);
  user-select: none;
}
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
button.busy:disabled { opacity: .8; }
button.busy::before, .spin {
  content: '';
  width: 14px; height: 14px; flex-shrink: 0;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  animation: spin .7s linear infinite;
}
.spin { display: inline-block; width: 12px; height: 12px; }

.btn-primary, .btn-accent {
  background: var(--accent-solid);
  color: var(--on-accent);
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.12);
}
.btn-primary:hover, .btn-accent:hover { background: var(--accent-solid-hover); }
.btn-primary:active:not(:disabled), .btn-accent:active:not(:disabled) { background: var(--accent-solid-active); }
.btn-primary { width: 100%; min-height: 38px; }

.btn-sm, .btn-cancel, .btn-icon {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-sm:hover, .btn-cancel:hover, .btn-icon:hover {
  background: var(--surface3);
  border-color: var(--border-strong);
}
.btn-sm { min-height: 32px; padding: 0 11px; font-size: var(--fs-xs); font-weight: 500; }
.btn-sm.danger { color: var(--danger-fg); border-color: var(--danger-bd); }
.btn-sm.danger:hover { background: var(--danger-bg); }
.btn-danger { background: var(--danger-solid); color: #fff; font-weight: 600; }
.btn-danger:hover { background: var(--danger-solid-hover); }

.btn-ghost, .btn-close {
  width: 34px; height: 34px; min-height: 0; padding: 0;
  border-radius: var(--radius-sm);
  color: var(--text2);
  background: transparent;
}
.btn-ghost:hover, .btn-close:hover { background: var(--surface2); color: var(--text); }

.link-btn {
  min-height: 0; padding: 2px 4px; color: var(--accent);
  font-weight: 500;
  text-decoration: underline; text-underline-offset: 3px; background: none;
}
.link-btn:hover { color: var(--focus-ring); }

/* Inputs */
input, textarea, select {
  font: inherit;
  font-size: var(--fs-sm);
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 12px;
  min-height: var(--control-h);
  transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);
}
input:hover, textarea:hover, select:hover { border-color: var(--border-strong); }
input:focus, textarea:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  outline: none;
}
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--danger-fg); }
input::placeholder, textarea::placeholder { color: var(--text3); }
textarea { resize: vertical; min-height: 80px; padding: 8px 12px; line-height: 1.5; }
select[multiple] { padding: 4px; }
input[type="checkbox"] {
  width: 16px; height: 16px; min-height: 0; padding: 0;
  accent-color: var(--accent-solid); cursor: pointer;
}
input[type="search"]::-webkit-search-cancel-button { display: none; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label {
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--text2);
  letter-spacing: 0.01em;
}
.hint { font-size: var(--fs-xs); color: var(--text3); }
.field-error { display: flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--danger-fg); margin-top: 2px; }
.req { color: var(--danger-fg); }

/* Main Workspace Layout — Split View on Desktop */
.workspace-shell {
  flex: 1;
  min-width: 0;
  display: flex;
  height: 100%;
  overflow: hidden;
  position: relative;
}

.main-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg);
}

.main {
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.mobile-bar {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  height: 52px;
  flex-shrink: 0;
  padding: 0 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.mobile-bar .mobile-title { font-weight: 600; font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

.rec-banner {
  display: flex; align-items: center; gap: 10px;
  min-height: 36px; padding: 6px 24px;
  background: var(--danger-bg); border-bottom: 1px solid var(--danger-bd);
  font-size: var(--fs-xs); font-weight: 500; flex-shrink: 0;
}
.rec-banner.hidden { display: none; }
.rec-banner .link-btn { margin-left: auto; font-size: var(--fs-xs); }
.rec-banner-time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--danger-fg); }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: var(--z-sidebar);
  user-select: none;
}
.sidebar-scrim { display: none; }

.sidebar-header {
  padding: 18px 16px 14px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.sidebar-header .logo {
  width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
  object-fit: cover; border: 1px solid var(--border);
}
.sidebar-header h1 {
  font-size: var(--fs-base); font-weight: 700; color: var(--text);
  line-height: 1.2; letter-spacing: -0.01em;
}
.sidebar-header p { font-size: 0.6875rem; color: var(--text3); margin-top: 2px; font-weight: 500; }

.sidebar-actions { padding: 12px 14px 10px; }

.session-search { padding: 0 14px 10px; }
.search-box { position: relative; display: flex; align-items: center; }
.search-box input {
  width: 100%;
  padding: 0 58px 0 34px;
  min-height: 34px;
  font-size: var(--fs-xs);
  background: var(--surface2);
  border-color: var(--border-subtle);
}
.search-box input:focus { background: var(--bg); border-color: var(--accent); }
.search-box .icon {
  position: absolute; left: 11px; top: 0; bottom: 0; margin: auto 0; height: 14px;
  color: var(--text3); pointer-events: none; display: flex;
}
.search-box .icon .ico { width: 14px; height: 14px; }
.search-box .search-kbd {
  position: absolute; right: 9px; pointer-events: none;
}
.session-search.has-query .search-kbd { display: none; }
.search-box .clear-btn {
  position: absolute; right: 3px; top: 0; bottom: 0; margin: auto 0;
  width: 28px; height: 28px; display: none;
}
.session-search.has-query .clear-btn { display: inline-flex; }

.sidebar-section-label {
  padding: 4px 18px 6px;
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text3);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.session-item {
  display: flex;
  align-items: center;
  min-height: 50px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid transparent;
  transition: background var(--t-fast), border-color var(--t-fast);
}
.session-item:hover { background: var(--surface2); }
.session-item.active {
  background: var(--accent-soft);
  border-color: var(--accent-border);
}
.session-main {
  flex: 1; min-width: 0; min-height: 48px;
  padding: 8px 10px; gap: 8px;
  justify-content: flex-start;
  text-align: left;
  font-weight: 400;
  border: none;
}
.session-main .info { flex: 1; min-width: 0; display: block; }
.session-item .name {
  display: block; font-size: var(--fs-sm); font-weight: 500; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-item.active .name { font-weight: 600; color: var(--accent); }
.session-item .meta {
  display: block; font-size: 0.6875rem; color: var(--text3); margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.search-empty { padding: 28px 14px; color: var(--text2); font-size: var(--fs-xs); text-align: center; line-height: 1.6; }
.session-item .badge {
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
  height: 20px; padding: 0 7px; border-radius: var(--radius-pill);
  font-size: 0.6875rem; font-weight: 600; font-variant-numeric: tabular-nums;
}
.session-item .badge .ico { width: 11px; height: 11px; }
.session-item .badge.is-idle { background: var(--surface3); color: var(--text2); }
.session-item .badge.is-done { background: var(--success-bg); color: var(--success-fg); border: 1px solid var(--success-bd); }
.session-item .badge.is-busy { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-bd); }
.pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1s infinite; }
.session-item .delete-btn { width: 28px; height: 28px; margin-right: 4px; opacity: 0; flex-shrink: 0; }
.session-item:hover .delete-btn, .session-item:focus-within .delete-btn, .session-item .delete-btn:hover { opacity: 1; }
.session-item .delete-btn:hover, .video-card .delete-btn:hover { color: var(--danger-fg); background: var(--danger-bg); }

/* Sidebar Footer: Health & Shortcuts */
.sidebar-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.6875rem;
  color: var(--text3);
}
.health-pills { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.health-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-weight: 500; color: var(--text2);
}
.health-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--text3);
}
.health-dot.ok { background: var(--success-fg); box-shadow: 0 0 6px var(--success-bd); }
.health-dot.err { background: var(--danger-fg); }

/* Empty / Skeleton */
.empty-state {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; text-align: center; padding: 48px 24px;
  color: var(--text2); line-height: var(--lh-prose);
}
.empty-state > * { max-width: 400px; }
.es-icon {
  width: 64px; height: 64px; border-radius: 16px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; color: var(--accent);
  margin-bottom: 4px;
}
.es-icon .ico { width: 28px; height: 28px; stroke-width: 1.6; }
.es-title { font-size: var(--fs-lg); font-weight: 600; color: var(--text); }
.es-sub { font-size: var(--fs-sm); color: var(--text2); }
.es-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }

.skeleton {
  background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: var(--radius-sm);
}
.sk-row { height: 48px; margin-bottom: 4px; border-radius: var(--radius); }
.sk-title { height: 20px; width: 40%; margin-bottom: 20px; }
.sk-line { height: 12px; margin-bottom: 12px; }
.sk-line:nth-child(3n) { width: 92%; }
.sk-line:nth-child(3n+1) { width: 70%; }

/* Session View */
.session-view {
  --pad-x: clamp(20px, 3vw, 40px);
  flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
}

.session-top {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: flex-start;
  padding: 20px var(--pad-x) 16px;
  background: var(--header-glass);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: var(--z-sticky);
  flex-shrink: 0;
}
.session-title { min-width: 0; flex: 1; }
.session-title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.session-top h2 {
  font-size: var(--fs-xl); font-weight: 700; line-height: var(--lh-tight);
  letter-spacing: -0.015em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-stats-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stat-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--radius-pill);
  font-size: 0.6875rem; font-weight: 600;
  background: var(--surface2); color: var(--text2); border: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.stat-pill.done { color: var(--success-fg); background: var(--success-bg); border-color: var(--success-bd); }
.stat-pill.busy { color: var(--info-fg); background: var(--info-bg); border-color: var(--info-bd); }
.stat-pill.error { color: var(--danger-fg); background: var(--danger-bg); border-color: var(--danger-bd); }

.instructions-box {
  margin-top: 8px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: var(--fs-xs);
  color: var(--text2);
  max-width: 82ch;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  padding: 7px 11px;
  border-radius: var(--radius);
}
.instructions-box .ico { margin-top: 2px; color: var(--accent); width: 14px; height: 14px; }
.instructions-box .inst-text {
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.45;
}
.instructions-box.expanded .inst-text {
  display: block;
  white-space: pre-wrap;
  max-height: 180px;
  overflow-y: auto;
}
.instructions-box .inst-toggle {
  min-height: 0; padding: 0 4px; font-size: 0.6875rem;
  color: var(--accent); font-weight: 600; flex-shrink: 0;
}

.session-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.rec-group { display: flex; align-items: center; gap: 10px; }
.rec-indicator {
  width: 10px; height: 10px; border-radius: 50%; background: var(--rec); flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6);
  animation: rec-pulse 1.4s ease-out infinite;
}
.recording-timer {
  font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 600;
  font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; color: var(--text);
}
.btn-sm.btn-record {
  min-height: var(--control-h); padding: 0 14px;
  font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
  background: var(--surface2); border-color: var(--border-strong);
}
.btn-record .ico-rec { color: var(--rec); width: 10px; height: 10px; }
.btn-record.active { background: var(--danger-solid); border-color: var(--danger-solid); color: #fff; }
.btn-record.active .ico-rec { color: #fff; }
.btn-record.active:hover { background: var(--danger-solid-hover); }
.btn-record.dead { border-color: var(--warn-fg); box-shadow: 0 0 0 2px var(--warn-bd); }

.inline-alert {
  display: flex; align-items: center; gap: 8px;
  margin: 12px var(--pad-x) 0; padding: 10px 14px;
  background: var(--warn-bg); border: 1px solid var(--warn-bd); color: var(--warn-fg);
  border-radius: var(--radius); font-size: var(--fs-xs); flex-shrink: 0;
}

/* Add Video Command Bar */
.add-video-bar {
  margin: 14px var(--pad-x) 10px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  display: grid;
  grid-template-columns: minmax(200px, 1fr) 130px auto auto;
  gap: 12px;
  align-items: start;
  flex-shrink: 0;
}
.add-video-bar .field-path { position: relative; }
.add-video-bar textarea {
  min-height: var(--control-h); height: var(--control-h);
  padding: 7px 12px; resize: none; overflow-y: hidden;
  font-family: var(--font-mono); font-size: var(--fs-xs);
}
.add-video-bar select { width: 100%; }
.add-video-bar .bar-control { padding-top: 21px; }
.check-pill {
  display: inline-flex; align-items: center; gap: 7px;
  min-height: var(--control-h); padding: 0 12px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer; color: var(--text2); font-size: var(--fs-xs); font-weight: 500;
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  user-select: none;
}
.check-pill:hover { border-color: var(--border-strong); color: var(--text); }
.check-pill:has(input:checked) {
  border-color: var(--accent-border);
  background: var(--accent-soft);
  color: var(--text);
}

/* Video Filter Toolbar */
.video-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 4px var(--pad-x) 10px;
  flex-shrink: 0;
}
.filter-pills {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--surface);
  padding: 3px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.filter-pill {
  min-height: 26px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--text2);
  border: none;
  background: transparent;
  gap: 5px;
}
.filter-pill:hover { color: var(--text); background: var(--surface2); }
.filter-pill.active {
  background: var(--surface3);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}
.filter-pill .count {
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  opacity: 0.75;
}
.video-search-mini {
  position: relative;
  width: 210px;
}
.video-search-mini input {
  width: 100%;
  min-height: 30px;
  padding: 0 10px 0 28px;
  font-size: var(--fs-xs);
  background: var(--surface);
}
.video-search-mini .ico {
  position: absolute; left: 9px; top: 0; bottom: 0; margin: auto 0;
  width: 13px; height: 13px; color: var(--text3); pointer-events: none;
}

/* Video List */
.video-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px var(--pad-x) 28px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.video-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 13px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: border-color var(--t-fast), background var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
  position: relative;
}
.video-card:hover {
  border-color: var(--border-strong);
  background: var(--surface2);
}
.video-card.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 3px 0 0 var(--accent);
}

.video-icon-box {
  width: 38px;
  height: 38px;
  border-radius: var(--radius);
  background: var(--surface2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--text2);
  position: relative;
}
.video-card.selected .video-icon-box {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--accent-border);
}
.video-icon-box .status-dot {
  position: absolute;
  right: -3px;
  bottom: -3px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 2px solid var(--surface);
}
.status-dot.queued { background: var(--text3); }
.status-dot.extracting_audio, .status-dot.transcribing, .status-dot.summarizing, .status-dot.analyzing_visual {
  background: var(--info-fg); animation: pulse 1s infinite;
}
.status-dot.done { background: var(--success-fg); }
.status-dot.error { background: var(--danger-fg); }

.video-card .info { flex: 1; min-width: 0; }
.video-card .info .vname {
  display: flex; align-items: center; gap: 7px;
  font-size: var(--fs-sm); font-weight: 600; color: var(--text);
}
.video-card .info .vname > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vmeta-tags { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
.vtag {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 6px; border-radius: 4px;
  font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
  background: var(--surface3); color: var(--text2);
}
.vtag .ico { width: 11px; height: 11px; }
.vtag.visual { color: var(--info-fg); background: var(--info-bg); }
.vtag.rec { color: var(--danger-fg); background: var(--danger-bg); }

.video-card .info .vpath {
  font-family: var(--font-mono);
  font-size: 0.72rem; color: var(--text3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 2px;
}
.vpath.chip { font-family: var(--font-sans); display: flex; align-items: center; gap: 4px; }
.vpath.chip .ico { width: 12px; height: 12px; }
.verror-msg {
  font-size: var(--fs-xs); color: var(--danger-fg); margin-top: 4px;
  display: flex; align-items: center; gap: 5px;
}
.verror-msg .ico { width: 13px; height: 13px; }

.vprogress { margin-top: 8px; max-width: 340px; }
.vsteps { display: flex; gap: 4px; }
.vstep { flex: 1; height: 4px; border-radius: var(--radius-pill); background: var(--surface3); }
.vstep.done { background: var(--success-fg); }
.vstep.current {
  background: linear-gradient(90deg, var(--info-fg) 25%, color-mix(in srgb, var(--info-fg) 55%, #fff) 50%, var(--info-fg) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
}
.video-card .info .vstatus { font-size: 0.6875rem; color: var(--text2); margin-top: 4px; font-weight: 500; }

.status-text-queued { color: var(--text2); }
.status-text-extracting_audio, .status-text-transcribing, .status-text-summarizing, .status-text-analyzing_visual { color: var(--info-fg); }
.status-text-done { color: var(--success-fg); }
.status-text-error { color: var(--danger-fg); }

.badge-status {
  display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  height: 24px; padding: 0 9px; border-radius: var(--radius-pill);
  font-size: 0.6875rem; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
}
.badge-status .ico { width: 12px; height: 12px; }
.badge-status.status-text-queued { background: var(--surface3); border-color: var(--border); }
.badge-status.status-text-extracting_audio, .badge-status.status-text-transcribing,
.badge-status.status-text-summarizing, .badge-status.status-text-analyzing_visual { background: var(--info-bg); border-color: var(--info-bd); }
.badge-status.status-text-done { background: var(--success-bg); border-color: var(--success-bd); }
.badge-status.status-text-error { background: var(--danger-bg); border-color: var(--danger-bd); }

.video-card .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.video-card .delete-btn { width: 30px; height: 30px; }

/* Detail Panel — Docked Split Pane on Desktop (>=1200px), Slide-over below */
.detail-panel {
  width: var(--detail-w);
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: var(--z-detail);
  flex-shrink: 0;
  transition: transform var(--t-base), opacity var(--t-base);
}
.detail-panel.hidden {
  display: none;
}
.detail-scrim { display: none; }

@media (max-width: 1199.98px) {
  .detail-panel {
    position: fixed;
    inset: 0 0 0 auto;
    width: min(680px, 92vw);
    box-shadow: var(--shadow-lg);
    transform: translateX(0);
  }
  .detail-panel.hidden {
    display: flex;
    transform: translateX(100%);
    visibility: hidden;
    box-shadow: none;
    transition: transform var(--t-base), visibility 0s linear 220ms;
  }
  .detail-panel:not(.hidden) + .detail-scrim {
    display: block; position: fixed; inset: 0; background: var(--scrim); z-index: calc(var(--z-detail) - 1);
  }
}

.detail-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: var(--surface);
}
.detail-title-wrap { min-width: 0; flex: 1; }
.detail-header h3 {
  font-size: var(--fs-base); font-weight: 600; line-height: var(--lh-tight);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.detail-subtitle {
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  color: var(--text3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 2px;
}
.detail-nav-btns { display: flex; align-items: center; gap: 4px; }

.detail-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
  background: var(--surface);
}
.detail-tabs::-webkit-scrollbar { display: none; }
.detail-tabs button {
  flex-shrink: 0;
  min-height: 40px;
  padding: 0 12px;
  border-radius: 0;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text2);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
  gap: 6px;
}
.detail-tabs button .ico { width: 14px; height: 14px; opacity: 0.8; }
.detail-tabs button:hover { color: var(--text); }
.detail-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.detail-tabs button.active .ico { opacity: 1; }
.detail-tabs button:focus-visible { outline-offset: -4px; }

.detail-content { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg); }
.detail-toolbar {
  display: flex;
  gap: 8px;
  padding: 8px 20px;
  min-height: 44px;
  border-bottom: 1px solid var(--border);
  align-items: center;
  background: var(--surface2);
  flex-shrink: 0;
}
.detail-toolbar .view-toggle {
  display: inline-flex;
  background: var(--bg);
  padding: 2px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.detail-toolbar .view-toggle button {
  min-height: 26px; padding: 0 10px; font-size: var(--fs-xs);
  background: transparent; color: var(--text2);
  border: none; border-radius: 4px;
}
.detail-toolbar .view-toggle button.active {
  background: var(--surface3);
  color: var(--text);
  font-weight: 600;
}
.detail-toolbar .doc-stats {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.6875rem;
  color: var(--text3);
}
.detail-toolbar .btn-icon { min-height: 28px; padding: 0 10px; font-size: var(--fs-xs); gap: 5px; }

.detail-content .md-raw {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  tab-size: 2;
  background: var(--bg);
  padding: 20px 24px;
  min-height: 100%;
  color: var(--text);
}
.md-raw::selection, .md-preview ::selection { background: var(--accent-soft); }

/* Interactive SRT View */
.srt-list {
  padding: 16px 20px 40px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.srt-cue {
  display: grid;
  grid-template-columns: 145px 1fr;
  gap: 12px;
  padding: 8px 12px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  font-size: var(--fs-sm);
  align-items: baseline;
}
.srt-cue:hover { border-color: var(--border-strong); }
.srt-time {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--accent);
  font-weight: 500;
  white-space: nowrap;
}
.srt-text { color: var(--text); line-height: 1.5; }

.detail-content .md-preview {
  max-width: 70ch;
  margin: 0 auto;
  padding: 24px 24px 56px;
  font-size: var(--fs-base);
  line-height: var(--lh-prose);
  color: var(--text);
  overflow-wrap: anywhere;
}
.md-preview > :first-child { margin-top: 0; }
.md-preview h1 { font-size: var(--fs-xl); font-weight: 700; margin: 28px 0 12px; line-height: var(--lh-tight); color: var(--text); letter-spacing: -0.01em; }
.md-preview h2 { font-size: var(--fs-lg); font-weight: 600; margin: 24px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); line-height: var(--lh-tight); }
.md-preview h3 { font-size: var(--fs-base); font-weight: 600; margin: 18px 0 6px; }
.md-preview h4 { font-size: var(--fs-xs); font-weight: 600; margin: 16px 0 4px; text-transform: uppercase; letter-spacing: .05em; color: var(--text2); }
.md-preview p { margin: 10px 0; }
.md-preview ul, .md-preview ol { padding-left: 22px; margin: 10px 0; }
.md-preview li + li { margin-top: 4px; }
.md-preview li > ul, .md-preview li > ol { margin: 4px 0; }
.md-preview li::marker { color: var(--text3); }
.md-preview input[type="checkbox"] { min-height: 0; margin-right: 6px; }
.md-preview strong { color: var(--text); font-weight: 600; }
.md-preview a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.md-preview code {
  font-family: var(--font-mono); font-size: .85em;
  background: var(--surface2); border: 1px solid var(--border);
  padding: .12em .4em; border-radius: 4px;
}
.md-preview pre {
  background: var(--surface); border: 1px solid var(--border);
  padding: 14px 16px; border-radius: var(--radius); overflow-x: auto; margin: 12px 0;
}
.md-preview pre code { background: none; border: 0; padding: 0; font-size: var(--fs-xs); }
.md-preview kbd {
  font-family: var(--font-mono); font-size: .85em; background: var(--surface2);
  border: 1px solid var(--border); border-bottom-width: 2px; padding: .1em .4em; border-radius: 4px;
}
.table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: var(--radius); }
.md-preview table { border-collapse: collapse; width: 100%; }
.md-preview th, .md-preview td { border-bottom: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: var(--fs-xs); }
.md-preview th + th, .md-preview td + td { border-left: 1px solid var(--border); }
.md-preview tr:last-child td { border-bottom: none; }
.md-preview th { background: var(--surface2); font-weight: 600; color: var(--text); }
.md-preview tbody tr:nth-child(even) { background: color-mix(in srgb, var(--surface2) 45%, transparent); }
.md-preview blockquote {
  border-left: 3px solid var(--accent); padding: 6px 14px; margin: 12px 0;
  color: var(--text2); background: var(--surface); border-radius: 0 var(--radius) var(--radius) 0;
}
.md-preview hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }
.md-preview img { max-width: 100%; border-radius: var(--radius); }

.detail-content .loading { padding: 24px; }
.detail-content .empty {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 56px 24px; text-align: center; color: var(--text2); line-height: var(--lh-prose);
}
.detail-error {
  display: flex; gap: 12px; align-items: flex-start; margin: 20px; padding: 14px;
  background: var(--danger-bg); border: 1px solid var(--danger-bd); color: var(--text);
  border-radius: var(--radius); font-size: var(--fs-sm);
}
.detail-error .ico { color: var(--danger-fg); margin-top: 2px; }
.detail-error p { margin-bottom: 10px; }

.save-section { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; max-width: 520px; }
.save-section input { width: 100%; font-family: var(--font-mono); font-size: var(--fs-xs); }
.save-checks {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.save-check-card {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: var(--fs-xs);
  font-weight: 500;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.save-check-card:hover { border-color: var(--border-strong); }
.save-check-card:has(input:checked) {
  border-color: var(--accent-border);
  background: var(--accent-soft);
}
.save-section button { align-self: flex-start; }
.save-item {
  display: flex; align-items: center; gap: 8px;
  color: var(--success-fg); margin-bottom: 4px;
  font-size: var(--fs-xs); font-family: var(--font-mono);
}

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: var(--scrim);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: var(--z-modal);
}
.modal-overlay.hidden { display: none; }
.confirm-overlay { z-index: calc(var(--z-modal) + 1); }
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  padding: 22px 24px;
  width: min(480px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
}
.modal h3 { margin-bottom: 14px; font-size: var(--fs-lg); font-weight: 600; }
.modal .field { margin-bottom: 14px; }
.modal .field input, .modal .field textarea { width: 100%; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
.confirm-msg { color: var(--text2); line-height: var(--lh-prose); margin-bottom: 8px; font-size: var(--fs-sm); }

/* Toasts */
.toast-region {
  position: fixed; right: 20px; bottom: 20px; z-index: var(--z-toast);
  display: flex; flex-direction: column; gap: 8px;
  width: min(380px, calc(100vw - 32px)); pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  border-left-width: 4px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 11px 8px 11px 12px;
  font-size: var(--fs-xs);
  font-weight: 500;
  animation: toast-in 200ms var(--ease);
}
.toast .ico { width: 17px; height: 17px; margin-top: 1px; }
.toast .toast-msg { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.4; }
.toast .toast-close { width: 26px; height: 26px; margin-top: -4px; }
.toast.leaving { animation: toast-out 150ms ease forwards; }
.toast.success { border-color: var(--success-bd); border-left-color: var(--success-fg); }
.toast.success .ico:first-child { color: var(--success-fg); }
.toast.error { border-color: var(--danger-bd); border-left-color: var(--danger-fg); }
.toast.error .ico:first-child { color: var(--danger-fg); }
.toast.warn { border-color: var(--warn-bd); border-left-color: var(--warn-fg); }
.toast.warn .ico:first-child { color: var(--warn-fg); }
.toast.info { border-color: var(--info-bd); border-left-color: var(--info-fg); }
.toast.info .ico:first-child { color: var(--info-fg); }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes rec-pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); } 100% { box-shadow: 0 0 0 9px rgba(239, 68, 68, 0); } }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toast-out { to { transform: translateY(8px); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .skeleton { animation: none; background: var(--surface2); }
  .vstep.current { animation: none; background: var(--info-fg); }
  .rec-indicator { animation: none; box-shadow: none; }
}

/* Responsive */
@media (max-width: 1199.98px) {
  .add-video-bar { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .add-video-bar .field-path, .add-video-bar > .bar-submit { grid-column: 1 / -1; }
  .add-video-bar .bar-control { padding-top: 0; }
  .add-video-bar > .bar-submit button { width: 100%; }
}

@media (max-width: 899.98px) {
  .mobile-bar { display: flex; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0;
    width: min(86vw, 310px); min-width: 0;
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform var(--t-base), visibility 0s linear 220ms;
  }
  .sidebar.open { transform: none; visibility: visible; transition: transform var(--t-base); }
  .sidebar-scrim.show { display: block; position: fixed; inset: 0; background: var(--scrim); z-index: calc(var(--z-sidebar) - 1); }
  .session-view { overflow-y: auto; }
  .video-list { flex: none; overflow: visible; }
  .rec-banner { padding: 6px 16px; }
}

@media (max-width: 639.98px) {
  .session-top { flex-direction: column; padding-inline: 16px; }
  .session-actions, .rec-group { width: 100%; }
  .session-actions .rec-group > .btn-record { flex: 1; }
  .add-video-bar { grid-template-columns: minmax(0, 1fr); margin-inline: 16px; }
  .video-toolbar { flex-direction: column; align-items: stretch; padding-inline: 16px; }
  .video-search-mini { width: 100%; }
  .inline-alert { margin-inline: 16px; }
  .video-list { padding-inline: 16px; }
  .video-card { flex-wrap: wrap; }
  .video-card .info { flex-basis: calc(100% - 54px); }
  .video-card .badge-status { margin-left: 52px; }
  .video-card .actions { margin-left: auto; }
  .detail-header, .detail-toolbar { padding-inline: 16px; }
  .srt-cue { grid-template-columns: 1fr; gap: 4px; }
  .save-checks { grid-template-columns: 1fr; }
  .toast-region { left: 16px; right: 16px; bottom: 16px; width: auto; }
  .modal-overlay { align-items: flex-end; }
  .modal { width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; }
}

@media (pointer: coarse) {
  button { min-height: 42px; }
  .btn-sm, .detail-toolbar .btn-icon, .detail-toolbar .view-toggle button { min-height: 40px; }
  .btn-ghost, .btn-close, .session-item .delete-btn, .video-card .delete-btn,
  .search-box .clear-btn, .toast .toast-close { width: 42px; height: 42px; min-height: 0; }
  .session-item .delete-btn { opacity: 1; }
  .check-pill, input, select { min-height: 42px; }
  input[type="checkbox"] { min-height: 0; }
  .add-video-bar textarea { min-height: 42px; height: 42px; }
}
</style>

<script>
const API = '/api';
const ACTIVE_STATES = ['extracting_audio', 'transcribing', 'analyzing_visual', 'summarizing'];
const STATUS_ICON = { queued: 'clock', done: 'check', error: 'alert' };
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const narrowDetail = window.matchMedia('(max-width: 1199.98px)');
const desktopMedia = window.matchMedia('(min-width: 900px)');

let state = {
  sessions: [],
  activeSessionId: null,
  activeVideoId: null,
  activeDetailTab: 'summary',
  viewMode: 'preview',
  currentDetailText: '',
  recording: null,
  recordingTimerId: null,
  recordingPrompted: new Set(),
  sessionSearch: '',
  videoFilter: 'all',
  videoSearch: '',
  instructionsExpanded: false,
  recorderDeathWarned: false,
  recordingBusy: false,
  videoStatus: {},
};

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function icon(name, cls = '') {
  return `<svg class="ico${cls ? ' ' + cls : ''}" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`;
}

/* Theme Management */
function initTheme() {
  const saved = localStorage.getItem('vr-theme');
  const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
  const theme = saved || (prefersLight ? 'light' : 'dark');
  applyTheme(theme);
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const useEl = $('#themeIcon use');
  if (useEl) useEl.setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem('vr-theme', next);
  applyTheme(next);
}

initTheme();

/* System Health Check */
async function checkHealth() {
  try {
    const h = await api('/health');
    const ollama = $('#healthOllama');
    const ffmpeg = $('#healthFfmpeg');
    const q = $('#healthQueue');
    if (ollama) ollama.className = 'health-dot ' + (h.ollama ? 'ok' : 'err');
    if (ffmpeg) ffmpeg.className = 'health-dot ' + (h.ffmpeg ? 'ok' : 'err');
    if (q) q.textContent = h.queue_size > 0 ? `Cola: ${h.queue_size}` : '';
  } catch (e) {}
}

function statusLabel(s) {
  const map = {
    queued: 'En cola',
    extracting_audio: 'Extrayendo audio',
    transcribing: 'Transcribiendo',
    analyzing_visual: 'Analizando pantalla',
    summarizing: 'Analizando',
    done: 'Completado',
    error: 'Error'
  };
  return map[s] || s;
}

function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function announce(msg, id = 'liveStatus') {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 50);
}

function setBusy(btn, on) {
  if (!btn) return;
  btn.disabled = on;
  btn.classList.toggle('busy', on);
  btn.setAttribute('aria-busy', on);
}

function setFieldError(input, errorSel, msg) {
  const err = $(errorSel);
  if (!err || !input) return;
  input.setAttribute('aria-invalid', msg ? 'true' : 'false');
  err.hidden = !msg;
  err.innerHTML = msg ? `${icon('alert')}${escapeHtml(msg)}` : '';
  if (msg) input.focus();
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight + 2, 112) + 'px';
  el.style.overflowY = el.scrollHeight > 112 ? 'auto' : 'hidden';
}

async function api(url, opts = {}) {
  const res = await fetch(API + url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || 'Error del servidor');
  }
  const ct = res.headers.get('content-type') || '';
  return ct.includes('application/json') ? res.json() : res.text();
}

/* Toasts */
function toastRegion() {
  let region = $('#toastRegion');
  if (!region) {
    region = document.createElement('div');
    region.id = 'toastRegion';
    region.className = 'toast-region';
    region.setAttribute('aria-live', 'polite');
    region.setAttribute('aria-atomic', 'false');
    document.body.appendChild(region);
  }
  return region;
}

function toast(msg, type = 'success') {
  const region = toastRegion();
  while (region.children.length >= 3) region.firstChild.remove();
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  if (type === 'error') el.setAttribute('role', 'alert');
  const lead = { success: 'check', error: 'alert', warn: 'alert', info: 'info' }[type] || 'info';
  el.innerHTML = `${icon(lead)}<span class="toast-msg"></span>` +
    `<button class="btn-ghost toast-close" aria-label="Cerrar notificación">${icon('x')}</button>`;
  el.querySelector('.toast-msg').textContent = msg;
  region.appendChild(el);
  scheduleToastClose(el, { success: 4000, info: 5000, warn: 6000, error: 8000 }[type] || 4000);
}

function scheduleToastClose(el, duration) {
  let left = duration, startedAt = 0, timer = null;
  const close = () => { clearTimeout(timer); el.classList.add('leaving'); setTimeout(() => el.remove(), 150); };
  const start = () => { if (timer) return; startedAt = Date.now(); timer = setTimeout(close, left); };
  const pause = () => { if (!timer) return; clearTimeout(timer); timer = null; left -= Date.now() - startedAt; };
  el.addEventListener('mouseenter', pause);
  el.addEventListener('focusin', pause);
  el.addEventListener('mouseleave', () => { if (!el.matches(':focus-within')) start(); });
  el.addEventListener('focusout', () => { if (!el.matches(':hover')) start(); });
  el.querySelector('.toast-close').addEventListener('click', close);
  start();
}

/* Custom Confirmation Dialog */
let activeConfirm = null;
let confirmQueue = Promise.resolve();

function confirmDialog(opts) {
  const p = confirmQueue.then(() => showConfirm(opts));
  confirmQueue = p;
  return p;
}

function showConfirm({ title, message, confirmLabel = 'Confirmar', cancelLabel = 'Cancelar', danger = false }) {
  return new Promise(resolve => {
    const opener = document.activeElement;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay confirm-overlay';
    overlay.innerHTML = `
      <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
        <h3 id="confirmTitle"></h3>
        <p class="confirm-msg" id="confirmMsg"></p>
        <div class="modal-actions">
          <button class="btn-cancel"></button>
          <button class="${danger ? 'btn-danger' : 'btn-accent'}"></button>
        </div>
      </div>`;
    overlay.querySelector('h3').textContent = title;
    overlay.querySelector('.confirm-msg').textContent = message;
    const [cancel, ok] = overlay.querySelectorAll('button');
    cancel.textContent = cancelLabel;
    ok.textContent = confirmLabel;
    const close = (result) => {
      activeConfirm = null;
      overlay.remove();
      if (opener && opener.isConnected) opener.focus();
      resolve(result);
    };
    activeConfirm = close;
    cancel.onclick = () => close(false);
    ok.onclick = () => close(true);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
    document.body.appendChild(overlay);
    cancel.focus();
  });
}

/* Sessions & Sidebar */

function renderSidebarError() {
  const list = $('#sessionList');
  list._html = null;
  list.setAttribute('aria-busy', 'false');
  list.innerHTML = '<div class="search-empty" role="alert">No se pudieron cargar las sesiones.<br>' +
    '<button class="btn-sm" style="margin-top:8px" onclick="loadSessions()">Reintentar</button></div>';
}

function onSessionSearch(value) {
  state.sessionSearch = value;
  $('#sessionSearchWrap').classList.toggle('has-query', value.trim().length > 0);
  renderSidebar();
}

function clearSessionSearch() {
  state.sessionSearch = '';
  $('#sessionSearchInput').value = '';

  renderSidebar();
  $('#sessionSearchInput').focus();
}

function filteredSessions() {
  const q = state.sessionSearch.trim().toLowerCase();
  if (!q) return state.sessions;
  return state.sessions.filter(s => s.name.toLowerCase().includes(q));
}

function captureFocus(container, key) {
  const a = document.activeElement;
  const item = a && container.contains(a) ? a.closest(`[data-${key}]`) : null;
  if (!item) return () => {};
  const id = item.dataset[key];
  const act = a !== item && a.dataset.act ? `[data-act="${a.dataset.act}"]` : '';
  return () => {
    const root = container.querySelector(`[data-${key}="${CSS.escape(id)}"]`);
    const target = act ? root?.querySelector(act) : root;
    if (target) target.focus({ preventScroll: true });
  };
}

function sessionBadge(s) {
  const total = s.videos.length;
  if (!total) return '';
  const done = s.videos.filter(v => v.status === 'done').length;
  const busy = s.videos.some(v => ACTIVE_STATES.includes(v.status));
  const complete = done === total;
  const kind = busy ? 'busy' : complete ? 'done' : 'idle';
  const lead = busy ? '<span class="pulse-dot" aria-hidden="true"></span>' : complete ? icon('check') : '';
  return `<span class="badge is-${kind} status-text-${complete ? 'done' : 'queued'}">${lead}${done}/${total}<span class="sr-only"> completados</span></span>`;
}

function sessionItemHtml(s) {
  const active = s.id === state.activeSessionId;
  const name = escapeHtml(s.name);
  return `
    <div class="session-item${active ? ' active' : ''}" data-sid="${s.id}" onclick="selectSession('${s.id}')">
      <button class="session-main" data-act="open" title="${name}"${active ? ' aria-current="true"' : ''}>
        <span class="info">
          <span class="name">${name}</span>
          <span class="meta">${s.videos.length} video${s.videos.length === 1 ? '' : 's'} · ${new Date(s.created_at).toLocaleDateString('es')}</span>
        </span>
        ${sessionBadge(s)}
      </button>
      <button class="btn-ghost delete-btn" data-act="delete" aria-label="Eliminar sesión ${name}" onclick="event.stopPropagation();deleteSession('${s.id}')">${icon('trash')}</button>
    </div>`;
}

function sidebarHtml() {
  if (state.sessions.length === 0) {
    return '<div class="search-empty">Sin sesiones<br><button class="link-btn" onclick="openNewSessionModal()">Crear la primera</button></div>';
  }
  const sessions = filteredSessions();
  if (sessions.length === 0) {
    return `<div class="search-empty">Sin resultados para "${escapeHtml(state.sessionSearch.trim())}"<br>` +
      '<button class="link-btn" onclick="clearSessionSearch()">Limpiar búsqueda</button></div>';
  }
  return sessions.map(sessionItemHtml).join('');
}

function announceSearchResults() {
  const q = state.sessionSearch.trim();
  const msg = q ? `${filteredSessions().length} resultados` : '';
  const el = $('#searchStatus');
  if (el && el.textContent !== msg) el.textContent = msg;
}

function renderSidebar() {
  const list = $('#sessionList');
  list.setAttribute('aria-busy', 'false');
  const countEl = $('#sessionCountBadge');
  if (countEl) countEl.textContent = state.sessions.length || '';
  const html = sidebarHtml();
  announceSearchResults();
  if (list._html === html) return;
  const restoreFocus = captureFocus(list, 'sid');
  list._html = html;
  list.innerHTML = html;
  restoreFocus();
}

function toggleSidebar() {
  if ($('#sidebar').classList.contains('open')) closeSidebar();
  else openSidebar();
}

function openSidebar() {
  $('#sidebar').classList.add('open');
  $('#sidebarScrim').classList.add('show');
  $('.main-col').inert = true;
  $('#menuToggle').setAttribute('aria-expanded', 'true');
  $('#btnNewSession').focus();
}

function closeSidebar() {
  const sidebar = $('#sidebar');
  if (!sidebar.classList.contains('open')) return;
  const hadFocus = sidebar.contains(document.activeElement);
  sidebar.classList.remove('open');
  $('#sidebarScrim').classList.remove('show');
  $('.main-col').inert = false;
  $('#menuToggle').setAttribute('aria-expanded', 'false');
  if (hadFocus) $('#menuToggle').focus();
}

function setVideoFilter(filter) {

function onVideoSearch(val) {
  state.videoSearch = val;
  const session = state.sessions.find(s => s.id === state.activeSessionId);
  if (session) refreshVideoList(session);
}

function filterVideoList(videos) {
  const q = state.videoSearch.trim().toLowerCase();
  return [...videos].reverse().filter(v => {
    if (state.videoFilter === 'done' && v.status !== 'done') return false;
    if (state.videoFilter === 'busy' && !(ACTIVE_STATES.includes(v.status) || v.status === 'queued')) return false;
    if (state.videoFilter === 'error' && v.status !== 'error') return false;
    if (q && !v.name.toLowerCase().includes(q) && !(v.original_path || '').toLowerCase().includes(q)) return false;
    return true;
  });
}

function renderSessionView() {
  const session = state.sessions.find(s => s.id === state.activeSessionId);
  if (!session) return;

  const recording = state.recording && state.recording.sid === session.id ? state.recording : null;
  const elapsed = recording ? fmtElapsed(Math.floor((Date.now() - recording.startedAt.getTime()) / 1000)) : '';
  const name = escapeHtml(session.name);
  const longInst = session.instructions && session.instructions.length > 110;

  const main = $('#mainContent');
  main.innerHTML = `
    <div class="session-view">
      <header class="session-top">
        <div class="session-title">
          <div class="session-title-row">
            <h2 title="${name}">${name}</h2>
            ${sessionStatsHtml(session.videos)}
          </div>
          ${session.instructions ? `
            <div class="instructions-box${state.instructionsExpanded ? ' expanded' : ''}" id="instructionsBox">
              ${icon('doc')}
              <span class="inst-text">${escapeHtml(session.instructions)}</span>
              ${longInst ? `<button class="inst-toggle" onclick="toggleInstructions()">${state.instructionsExpanded ? 'Ocultar' : 'Ver todo'}</button>` : ''}
            </div>` : ''}
        </div>
        <div class="session-actions">${recordingGroupHtml(recording, elapsed)}</div>
      </header>
      ${recording && recording.alive === false ? `<div class="inline-alert" role="alert">${icon('alert')}El grabador se detuvo. Pulsa Detener para guardar lo grabado.</div>` : ''}
      ${addVideoBarHtml()}
      ${videoToolbarHtml(session.videos)}
      <div class="video-list" id="videoList" aria-live="off">
        ${session.videos.length === 0 ? emptyVideosHtml() : renderVideoCards(session.videos)}

    </div>`;

  setMobileTitle(session.name);
  updateRecBanner();
  if (recording) startRecordingTimer();
}

function videoProgressHtml(v) {
  const steps = v.analyze_visual ? ACTIVE_STATES : ACTIVE_STATES.filter(s => s !== 'analyzing_visual');
  const idx = steps.indexOf(v.status);
  if (idx < 0) return '';
  const segs = steps.map((_, i) => `<span class="vstep${i < idx ? ' done' : i === idx ? ' current' : ''}"></span>`).join('');
  const label = `Paso ${idx + 1} de ${steps.length} · ${statusLabel(v.status)}`;
  return `
    <div class="vprogress">
      <div class="vsteps" role="progressbar" aria-valuemin="0" aria-valuemax="${steps.length}" aria-valuenow="${idx + 1}" aria-valuetext="${label}" aria-label="Progreso: ${statusLabel(v.status)}">${segs}</div>
      <div class="vstatus">${label}</div>
    </div>`;
}

function statusBadgeHtml(status) {
  const lead = ACTIVE_STATES.includes(status) ? '<span class="spin" aria-hidden="true"></span>' : icon(STATUS_ICON[status] || 'clock');
  return `<span class="badge-status status-text-${status}">${lead}${statusLabel(status)}</span>`;
}

function videoCardHtml(v) {

  return `

        <span class="status-dot ${v.status}"></span>
      </div>
      <div class="info">
        <div class="vname">

        ${v.status === 'done' ? `<button class="btn-sm" data-act="view" onclick="event.stopPropagation();selectVideo('${v.id}')">Abrir</button>` : ''}

function renderVideoCards(videos) {
  const filtered = filterVideoList(videos);
  if (filtered.length === 0) {
    return `<div class="search-empty">No hay videos que coincidan con el filtro actual.<br><button class="link-btn" onclick="setVideoFilter('all');state.videoSearch='';renderSessionView()">Mostrar todos</button></div>`;

  return filtered.map(videoCardHtml).join('');
}

function onCardKey(e, vid) {
  if (e.target !== e.currentTarget) return;
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    selectVideo(vid);
  }
}

async function addVideos() {
  const input = $('#videoPathsInput');
  const lang = $('#videoLanguage');
  const raw = input.value;
  if (!raw.trim()) { setFieldError(input, '#videoPathsError', 'Ingresa al menos una ruta'); return; }
  setFieldError(input, '#videoPathsError', '');

  const paths = raw.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  const analyzeVisual = $('#videoAnalyzeVisual')?.checked || false;
  const btn = $('#btnAddVideos');
  setBusy(btn, true);
  try {
    const res = await api(`/sessions/${state.activeSessionId}/videos`, {
      method: 'POST',
      body: JSON.stringify({ paths, language: lang.value, analyze_visual: analyzeVisual }),
    });
    input.value = '';
    await loadSessions();
    renderSessionView();
    toast(`${res.added.length} video(s) agregados`);
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    setBusy(btn, false);
  }
}

async function retryVideo(vid) {
  try {
    await api(`/sessions/${state.activeSessionId}/videos/${vid}/retry`, { method: 'POST' });
    await loadSessions();
    renderSessionView();
    toast('Video reencolado');
    announce('Video reencolado');
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function deleteVideo(vid) {
  const session = state.sessions.find(s => s.id === state.activeSessionId);
  const video = session?.videos.find(v => v.id === vid);
  const ok = await confirmDialog({
    title: 'Eliminar video',
    message: `Se eliminará ${video ? `"${video.name}"` : 'este video'} y sus resultados (transcripción, resumen y análisis). No se puede deshacer.`,
    confirmLabel: 'Eliminar',
    danger: true,
  });
  if (!ok) return;
  try {
    await api(`/sessions/${state.activeSessionId}/videos/${vid}`, { method: 'DELETE' });
    if (state.activeVideoId === vid) closeDetail();
    await loadSessions();
    renderSessionView();
    toast('Video eliminado');
  } catch (e) {
    toast(e.message, 'error');
  }
}

function selectVideo(vid) {
  state.activeVideoId = vid;
  $$('#videoList .video-card').forEach(c => c.classList.toggle('selected', c.dataset.vid === vid));
  openDetail(vid);
}

function syncTabs() {
  $$('.detail-tabs button').forEach(b => {
    const on = b.dataset.tab === state.activeDetailTab;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on);
    b.tabIndex = on ? 0 : -1;
  });
  $('#detailContent').setAttribute('aria-labelledby', `tab-${state.activeDetailTab}`);
}

async function openDetail(vid) {
  const panel = $('#detailPanel');
  panel.classList.remove('hidden');
  panel.setAttribute('aria-modal', narrowDetail.matches ? 'true' : 'false');

  const session = state.sessions.find(s => s.id === state.activeSessionId);
  const video = session?.videos.find(v => v.id === vid);
  if (!video) return;

  $('#detailTitle').textContent = video.name;
  $('#detailSubtitle').textContent = video.original_path || '';

  if (!$(`.detail-tabs button[data-tab="${state.activeDetailTab}"]`)) state.activeDetailTab = 'summary';
  syncTabs();
  if (narrowDetail.matches) $('#detailTitle').focus();

  await loadDetailContent(state.activeDetailTab);
}

function closeDetail() {
  const panel = $('#detailPanel');
  const returnTo = panel.classList.contains('hidden') ? null : state.activeVideoId;
  state.activeVideoId = null;
  state.activeDetailTab = 'summary';
  panel.classList.add('hidden');
  $$('#videoList .video-card.selected').forEach(c => c.classList.remove('selected'));
  if (returnTo) $(`#videoList [data-vid="${CSS.escape(returnTo)}"]`)?.focus();
